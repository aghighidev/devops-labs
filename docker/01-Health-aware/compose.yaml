services:
  app:
    build: ./app
    restart: always
    ports:
      - "5000:5000"
    networks:
      - frontend
  worker:
    build: ./worker
    restart: always
    command: > 
      sh -c 'while true; do log=$(python -c "import urllib.request; print(urllib.request.urlopen(\"http://app:5000/health\").read().decode())"); echo "$$log"; sleep 5; done'
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend
networks:
  frontend:
