services:
  app:
    image: wordpress:latest
    restart: always
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: elessar
      WORDPRESS_DB_PASSWORD: mypass
      WORDPRESS_DB_NAME: mydb
    ports:
      - "3000:80"
  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_USER: elessar
      MYSQL_PASSWORD: mypass
      MYSQL_DATABASE: mydb
    volumes:
      - dbdata:/var/lib/mysql
volumes:
  dbdata:
